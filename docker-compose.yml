# =============================================================
# MYLO MASTER — Production Docker Compose
# Security: All internal services isolated from public network
# =============================================================

networks:
  public_net:
    driver: bridge
    name: mylo_public
  internal_net:
    driver: bridge
    internal: true
    name: mylo_internal
  db_net:
    driver: bridge
    internal: true
    name: mylo_db

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_ssl:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

services:
  # ─── Nginx (единственная публичная точка входа) ────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: mylo_nginx
    restart: unless-stopped
    user: "101:101"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - nginx_ssl:/etc/nginx/ssl
      - uploads_data:/var/www/uploads:ro
      - logs_data:/var/log/nginx
    networks:
      - public_net
      - internal_net
    depends_on:
      api:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── API Gateway / Main API ───────────────────────────────
  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
      target: production
    container_name: mylo_api
    restart: unless-stopped
    user: "1001:1001"
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES}
      - JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CSRF_SECRET=${CSRF_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL}
      - UPLOAD_PROVIDER=${UPLOAD_PROVIDER}
      - LOCAL_UPLOAD_PATH=/app/uploads
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - internal_net
      - db_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Auth Service ─────────────────────────────────────────
  auth-service:
    build:
      context: ./backend
      dockerfile: ./auth-service/Dockerfile
      target: production
    container_name: mylo_auth
    restart: unless-stopped
    user: "1001:1001"
    expose:
      - "3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES=${JWT_ACCESS_EXPIRES}
      - JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CSRF_SECRET=${CSRF_SECRET}
      - OTP_LIFETIME_SECONDS=${OTP_LIFETIME_SECONDS}
      - OTP_MAX_ATTEMPTS=${OTP_MAX_ATTEMPTS}
      - OTP_BLOCK_DURATION_MINUTES=${OTP_BLOCK_DURATION_MINUTES}
      - OTP_RATE_PER_NUMBER_SECONDS=${OTP_RATE_PER_NUMBER_SECONDS}
      - OTP_RATE_PER_IP_HOUR=${OTP_RATE_PER_IP_HOUR}
      - SMS_PROVIDER=${SMS_PROVIDER}
      - SMSAERO_EMAIL=${SMSAERO_EMAIL}
      - SMSAERO_API_KEY=${SMSAERO_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS}
    networks:
      - internal_net
      - db_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Admin Service ────────────────────────────────────────
  admin-service:
    build:
      context: ./backend
      dockerfile: ./admin-service/Dockerfile
      target: production
    container_name: mylo_admin
    restart: unless-stopped
    user: "1001:1001"
    expose:
      - "3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
    networks:
      - internal_net
      - db_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mylo_postgres
    restart: unless-stopped
    user: "70:70"
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db_net
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c log_min_duration_statement=1000
        -c log_connections=on
        -c log_disconnections=on
        -c log_lock_waits=on
        -c ssl=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: mylo_redis
    restart: unless-stopped
    user: "999:999"
    expose:
      - "6379"
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --save 60 10000
        --appendonly yes
        --appendfsync everysec
        --no-appendfsync-on-rewrite no
        --aof-rewrite-incremental-fsync yes
        --activerehashing yes
        --protected-mode yes
        --bind 0.0.0.0
        --tcp-backlog 511
        --timeout 300
        --tcp-keepalive 300
        --loglevel notice
        --rename-command FLUSHALL ""
        --rename-command FLUSHDB ""
        --rename-command DEBUG ""
        --rename-command CONFIG "CONFIG_SECRET_RENAME"
    volumes:
      - redis_data:/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: mylo_frontend
    restart: unless-stopped
    user: "101:101"
    expose:
      - "4173"
    environment:
      - NODE_ENV=production
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
