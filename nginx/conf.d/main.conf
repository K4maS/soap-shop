# =============================================================
# MYLO MASTER — Main Site Virtual Host
# =============================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://yourdomain.com$request_uri;
    }
}

# www → non-www redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yourdomain.com;

    ssl_certificate /etc/nginx/ssl/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/yourdomain.com/chain.pem;

    return 301 https://yourdomain.com$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;

    ssl_certificate /etc/nginx/ssl/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/yourdomain.com/chain.pem;

    # Security headers
    include /etc/nginx/snippets/security-headers.conf;

    # Connection limit
    limit_conn conn_limit 20;

    # Request ID propagation
    add_header X-Request-Id $request_id always;

    # ─── Static files ────────────────────────────────────
    location /uploads/ {
        alias /var/www/uploads/;
        limit_req zone=global burst=20 nodelay;

        # Security: запрет выполнения скриптов
        add_header X-Content-Type-Options "nosniff" always;

        # Только изображения
        if ($request_filename !~* \.(jpg|jpeg|png|webp|gif)$) {
            return 403;
        }

        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── API ─────────────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://auth_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/v1/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://api_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # ─── Frontend SPA ────────────────────────────────────
    location / {
        limit_req zone=global burst=50 nodelay;

        proxy_pass http://frontend_backend;
        include /etc/nginx/snippets/proxy-params.conf;

        # SPA fallback
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback;
    }

    location @spa_fallback {
        proxy_pass http://frontend_backend;
        proxy_set_header X-Original-URI $request_uri;
    }

    # ─── Health ───────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ─── Deny hidden files ───────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =============================================================
# Admin Subdomain
# =============================================================

server {
    listen 80;
    server_name admin.yourdomain.com;
    return 301 https://admin.yourdomain.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.yourdomain.com;

    ssl_certificate /etc/nginx/ssl/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/yourdomain.com/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/yourdomain.com/chain.pem;

    include /etc/nginx/snippets/security-headers.conf;

    # IP restriction для admin — раскомментировать в production
    # allow 1.2.3.4;    # Office IP
    # allow 5.6.7.8;    # VPN
    # deny all;

    limit_conn conn_limit 10;
    add_header X-Request-Id $request_id always;

    location /api/admin/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://admin_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        limit_req zone=global burst=30 nodelay;

        proxy_pass http://frontend_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location ~ /\. {
        deny all;
    }
}
