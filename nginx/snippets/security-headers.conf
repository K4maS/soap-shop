# Security Headers — применяются ко всем ответам
# Защита: XSS, Clickjacking, MIME sniffing, Data leakage

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# Content-Security-Policy — строгая политика
# Защита: XSS, data: injection, mixed content
add_header Content-Security-Policy "
  default-src 'self';
  script-src 'self' 'nonce-$request_id';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob: https://cdn.yourdomain.com;
  font-src 'self';
  connect-src 'self' wss://yourdomain.com;
  media-src 'none';
  object-src 'none';
  frame-src 'none';
  frame-ancestors 'none';
  base-uri 'self';
  form-action 'self';
  upgrade-insecure-requests;
  block-all-mixed-content;
" always;

# HSTS — принудительный HTTPS на 2 года
# SECURITY: включать ТОЛЬКО после проверки HTTPS работает корректно
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
