server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy
    # - default-src 'self'
    # - script-src 'self' (no eval, no inline — CSP compatible build)
    # - style-src 'self' 'unsafe-inline' fonts.googleapis.com (Tailwind injects some inline)
    # - img-src 'self' data: https: (product images from CDN)
    # - connect-src 'self' api.mylomaster.ru
    # - font-src 'self' fonts.gstatic.com
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.mylomaster.ru; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---------------------------------------------------------------------------
    # Health check endpoint
    # ---------------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------------------------
    # Static assets — long-term caching (Vite adds content hashes)
    # ---------------------------------------------------------------------------
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # Fonts
    # ---------------------------------------------------------------------------
    location ~* \.(woff|woff2|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # manifest + favicon — short cache
    # ---------------------------------------------------------------------------
    location ~* \.(ico|png|svg|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ---------------------------------------------------------------------------
    # SPA fallback — all routes to index.html
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # index.html — no cache (always fetch latest)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires -1;
        }
    }

    # ---------------------------------------------------------------------------
    # Disable access to hidden files
    # ---------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
